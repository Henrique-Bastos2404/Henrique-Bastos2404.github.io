<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <title>Login — Beyond The Crown</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login — Beyond The Crown">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@700;800&family=Inter:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .login-container {
            max-width: 500px;
            margin: 60px auto;
            background-color: #020802;
            border: 2px solid #1a331a;
            border-radius: 8px;
            padding: 40px;
        }

        .login-title {
            color: #2ecc71;
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2ecc71;
            margin-bottom: 8px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #1a331a;
            background-color: #0a0f0a;
            color: #2ecc71;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .form-group input::placeholder {
            color: #1a331a;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .form-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #1a331a;
            color: #2ecc71;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        .form-buttons button:hover {
            background-color: #2a4d2a;
        }

        .form-buttons button.primary {
            background-color: #2ecc71;
            color: #020802;
        }

        .form-buttons button.primary:hover {
            background-color: #33ff33;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #1a331a;
            font-size: 14px;
        }

        .toggle-form a {
            color: #2ecc71;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s ease;
        }

        .toggle-form a:hover {
            color: #33ff33;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 4px;
            background-color: rgba(0, 255, 0, 0.1);
            border: 1px solid #1a331a;
        }

        .user-profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a331a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #2ecc71;
        }

        .user-profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-profile-name {
            color: #2ecc71;
            font-weight: 700;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
        }

        .user-profile-status {
            color: #1a331a;
            font-size: 10px;
            font-family: 'Inter', sans-serif;
        }

        .user-profile-logout {
            color: #ff6666;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }

        .user-profile-logout:hover {
            color: #ff9999;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .message.success {
            background-color: rgba(0, 255, 0, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .message.error {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 4px;
            background-color: rgba(0, 255, 0, 0.1);
            border: 1px solid #1a331a;
        }

        .user-profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a331a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #2ecc71;
        }

        .user-profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-profile-name {
            color: #2ecc71;
            font-weight: 700;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
        }

        .user-profile-status {
            color: #1a331a;
            font-size: 10px;
            font-family: 'Inter', sans-serif;
        }

        .user-profile-logout {
            color: #ff6666;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }

        .user-profile-logout:hover {
            color: #ff9999;
        }
    </style>
</head>
<body>

  <div class="w3-top">
  <div class="w3-bar w3-card game-nav" style="background-color: #020802; border-bottom: 1px solid #1a331a; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
    <div style="display: flex;">
      <a href="index.html" class="w3-bar-item w3-button w3-padding-large">INÍCIO</a>
      <a href="leaderboard.html" class="w3-bar-item w3-button w3-padding-large">PLACARD</a>
      <a href="download.html" class="w3-bar-item w3-button w3-padding-large">DOWNLOAD</a>
      <a href="discord.html" class="w3-bar-item w3-button w3-padding-large">DISCORD</a>
    </div>
    <div id="authNav" style="margin-left: auto;">
      <a href="login.html" class="w3-bar-item w3-button w3-padding-large">LOGIN | REGISTO</a>
    </div>
  </div>
</div>

<div class="w3-content" style="max-width:2000px;margin-top:46px">
    <div class="login-container">
        <h2 class="login-title">Login</h2>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-username">Utilizador</label>
                <input type="text" id="login-username" placeholder="Insira o seu utilizador" required>
            </div>

            <div class="form-group">
                <label for="login-password">Palavra-passe</label>
                <input type="password" id="login-password" placeholder="Insira a sua palavra-passe" required>
            </div>

            <div id="loginMessage" class="message" style="display: none;"></div>

            <div class="form-buttons">
                <button type="submit" class="primary">Entrar</button>
            </div>
        </form>

        <div class="toggle-form">
            Não tem uma conta? <a href="registro.html">Registe-se aqui</a>
        </div>
    </div>
</div>

  <footer class="w3-container w3-padding-64 w3-center w3-dark-green">
    <p class="w3-medium">© 2026 Beyond The Crown — BIT SHIFT</p>
  </footer>

  <script>
    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        fetch('php/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        })
        .then(r => r.json())
        .then(data => {
            const messageDiv = document.getElementById('loginMessage');
            
            if (data.success) {
                messageDiv.textContent = data.message;
                messageDiv.className = 'message success';
                messageDiv.style.display = 'block';
                // Atualiza a navbar imediatamente usando a sessão recém-criada
                try { if (window.auth_nav_refresh) window.auth_nav_refresh(); } catch (e) {}

                                // Esperar até que a sessão esteja visível via API, então redirecionar
                                (function waitForSession(attempts){
                                    attempts = attempts || 0;
                                    fetch('php/get_user_info.php', { credentials: 'include' }).then(r => r.json()).then(u => {
                                        if (u && u.username) return window.location.href = 'index.html';
                                        if (attempts < 8) setTimeout(() => waitForSession(attempts+1), 250);
                                        else window.location.href = 'index.html';
                                    }).catch(() => { if (attempts < 8) setTimeout(() => waitForSession(attempts+1), 250); else window.location.href = 'index.html'; });
                                })();
            } else {
                messageDiv.textContent = data.message;
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            }
        })
        .catch(err => {
            console.error('Erro:', err);
            const messageDiv = document.getElementById('loginMessage');
            messageDiv.textContent = 'Erro ao fazer login';
            messageDiv.className = 'message error';
            messageDiv.style.display = 'block';
        });
    }

    function logoutUser() {
      fetch("php/login.php", { method: "POST", headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ action: 'logout' }) })
        .then(() => {
          window.location.href = 'login.html';
        });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c]));
    }`r`      // Load shared auth script
        (function(){ var s=document.createElement('script'); s.src='js/auth.js'; document.body.appendChild(s); })();
  </script>
</body>
</html>
