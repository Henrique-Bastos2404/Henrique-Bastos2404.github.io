<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <title>PLACARD — Beyond The Crown</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PLACARD de Jogadores — Beyond The Crown">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@700;800&family=Inter:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .leaderboard-container {
            max-width: 900px;
            margin: 60px auto;
            background-color: #020802;
            border: 2px solid #1a331a;
            border-radius: 8px;
            padding: 40px;
            overflow-x: auto;
        }

        .leaderboard-title {
            color: #2ecc71;
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            color: #2ecc71;
        }

        .leaderboard-table thead {
            background-color: #1a331a;
        }

        .leaderboard-table th {
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            border-bottom: 2px solid #2ecc71;
            text-transform: uppercase;
        }

        .leaderboard-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #1a331a;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }

        .leaderboard-table tbody tr:hover {
            background-color: rgba(0, 255, 0, 0.05);
        }

        .rank-1 {
            background-color: rgba(255, 215, 0, 0.1);
        }

        .rank-2 {
            background-color: rgba(192, 192, 192, 0.05);
        }

        .rank-3 {
            background-color: rgba(205, 127, 50, 0.05);
        }

        .medal {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            margin-right: 10px;
            border-radius: 50%;
            font-weight: 700;
        }

        .medal-1 {
            background-color: #FFD700;
            color: #000;
        }

        .medal-2 {
            background-color: #C0C0C0;
            color: #000;
        }

        .medal-3 {
            background-color: #CD7F32;
            color: #fff;
        }

        .score-highlight {
            color: #2ecc71;
            font-weight: 700;
        }



        .form-group input:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .form-group input::placeholder {
            color: #1a331a;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: #020802;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 12px;
        }

        .submit-btn:hover {
            background-color: #33ff33;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .message.success {
            background-color: rgba(0, 255, 0, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .message.error {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
        }

        @media (max-width: 600px) {
            .leaderboard-container {
                padding: 20px;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 8px;
                font-size: 12px;
            }

            .leaderboard-title {
                font-size: 24px;
            }

            .form-container {
                margin: 20px auto;
                padding: 20px;
            }
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 4px;
            background-color: rgba(0, 255, 0, 0.1);
            border: 1px solid #1a331a;
        }

        .user-profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1a331a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #2ecc71;
        }

        .user-profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-profile-name {
            color: #2ecc71;
            font-weight: 700;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
        }

        .user-profile-status {
            color: #1a331a;
            font-size: 10px;
            font-family: 'Inter', sans-serif;
        }

        .user-profile-logout {
            color: #ff6666;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }

        .user-profile-logout:hover {
            color: #ff9999;
        }
        /* Profile button + dropdown */
        .profile-menu { position: relative; display: inline-block; }
        .profile-btn { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 24px; background-color: rgba(2,8,2,0.9); border: 1px solid #1a331a; color: #2ecc71; cursor: pointer; font-weight: 700; text-transform: uppercase; }
        .profile-btn-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #2ecc71; }
        .profile-btn-name { font-size: 14px; text-transform: uppercase; }
        .profile-go-btn { background: transparent; border: 1px solid rgba(255,255,255,0.04); color: #2ecc71; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; text-transform: uppercase; }
        .profile-go-btn:hover { background: rgba(46,204,113,0.03); }
        .profile-dropdown { position: absolute; right: 0; top: calc(100% + 8px); background: #020802; border: 1px solid #1a331a; padding: 6px; border-radius: 6px; display: none; flex-direction: column; min-width: 150px; z-index: 50; }
        .profile-dropdown a { color: #2ecc71; padding: 8px 10px; text-decoration: none; font-weight: 600; text-transform: uppercase; }
        .profile-dropdown a:hover { background: rgba(46,204,113,0.06); }

    </style>
</head>
<body>

  <div class="w3-top">
  <div class="w3-bar w3-card game-nav" style="background-color: #020802; border-bottom: 1px solid #1a331a; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
    <div style="display: flex;">
      <a href="index.html" class="w3-bar-item w3-button w3-padding-large">INÍCIO</a>
      <a href="leaderboard.html" class="w3-bar-item w3-button w3-padding-large">PLACARD</a>
      <a href="download.html" class="w3-bar-item w3-button w3-padding-large">DOWNLOAD</a>
      <a href="discord.html" class="w3-bar-item w3-button w3-padding-large">DISCORD</a>
    </div>
    <div id="authNav" style="margin-left: auto;">
      <a href="login.html" class="w3-bar-item w3-button w3-padding-large">LOGIN | REGISTO</a>
    </div>
  </div>
</div>

<div class="w3-content" style="max-width:2000px;margin-top:46px">
    <div class="leaderboard-container">
        <h1 class="leaderboard-title">🏆 PLACARD Global 🏆</h1>

        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th style="width: 80px;">Posição</th>
                    <th>Jogador</th>
                    <th style="width: 120px;">Pontos</th>
                    <th style="width: 100px;">Fase</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="4">Acarregar...</td></tr>
            </tbody>
        </table>
    </div>



    <div class="w3-container w3-center w3-padding-32">
        <a href="index.html" class="w3-button" style="padding: 15px 40px; font-size: 18px; background-color: #2ecc71 !important; color: #020802 !important; border: 2px solid #2ecc71; border-radius: 8px; font-weight: bold; transition: all 0.3s ease;">Voltar</a>
    </div>
</div>

  <footer class="w3-container w3-padding-64 w3-center w3-dark-green">
    <p class="w3-medium">© 2026 Beyond The Crown — BIT SHIFT</p>
  </footer>

  <script>
    let isLoggedIn = false;
    let currentUsername = null;

    function checkLoginStatus() {
      fetch("php/leaderboard.php", { credentials: 'include' })
        .then(r => r.json())
        .then(data => {
          isLoggedIn = data.isLoggedIn;
          updateAuthNav(isLoggedIn);
          renderLeaderboard(data.data);
        })
        .catch(err => {
          console.error("Erro ao buscar leaderboard:", err);
          const tbody = document.getElementById("leaderboard-body");
          tbody.innerHTML = "<tr><td colspan='4'>Erro ao carregar dados</td></tr>";
        });
    }

    function updateAuthNav(loggedIn) {
      const authNav = document.getElementById('authNav');
      const loginLink = '<a href="login.html" class="w3-bar-item w3-button w3-padding-large">LOGIN | REGISTO</a>';

      if (loggedIn) {
        const renderMenu = (u) => {
          const username = escapeHtml((u.username || '').toUpperCase());
          authNav.innerHTML = `
            <div class="profile-menu">
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="profile-btn" aria-expanded="false" onclick="toggleProfileDropdown(event, this)">
                  <img src="${u.profile_image || 'default-avatar.svg'}" class="profile-btn-avatar" alt="${username}">
                  <span class="profile-btn-name">${username}</span>
                </button>
                <button class="profile-go-btn" id="auth-profile-btn" title="PERFIL">PERFIL</button>
              </div>
              <div class="profile-dropdown" role="menu">
                <a href="profile.html">IR AO PERFIL</a>
                <a href="#" id="logoutLink">LOGOUT</a>
              </div>
            </div>
          `;

          const btn = authNav.querySelector('.profile-btn');
          const dropdown = authNav.querySelector('.profile-dropdown');
          const logoutLink = authNav.querySelector('#logoutLink');
          const profileGoBtn = authNav.querySelector('#auth-profile-btn');

          btn.addEventListener('click', (e) => { e.stopPropagation(); const expanded = btn.getAttribute('aria-expanded') === 'true'; btn.setAttribute('aria-expanded', !expanded); dropdown.style.display = expanded ? 'none' : 'flex'; });
          logoutLink.addEventListener('click', (e) => { e.preventDefault(); logoutUser(); });
          if (profileGoBtn) profileGoBtn.addEventListener('click', (e) => { e.preventDefault(); window.location.href = 'profile.html'; });

          document.addEventListener('click', () => { if (dropdown.style.display === 'flex') { dropdown.style.display = 'none'; btn.setAttribute('aria-expanded', 'false'); } });
        };

        fetch("php/get_user_info.php", { credentials: 'include' }).then(r => r.json()).then(u => { if (u.username) renderMenu(u); else authNav.innerHTML = loginLink; }).catch(() => { authNav.innerHTML = loginLink; });
      } else {
        authNav.innerHTML = loginLink;
      }
    }

    function renderLeaderboard(data) {
      const tbody = document.getElementById("leaderboard-body");
      tbody.innerHTML = "";

      if (!data || !data.length) {
        tbody.innerHTML = "<tr><td colspan='4'>Sem dados ainda</td></tr>";
        return;
      }

      data.forEach((player, i) => {
        const tr = document.createElement("tr");

        if (i === 0) tr.classList.add("rank-1");
        if (i === 1) tr.classList.add("rank-2");
        if (i === 2) tr.classList.add("rank-3");

        let medal = "";
        if (i === 0) medal = '<span class="medal medal-1">1º</span>';
        else if (i === 1) medal = '<span class="medal medal-2">2º</span>';
        else if (i === 2) medal = '<span class="medal medal-3">3º</span>';
        else medal = (i+1) + "º";

        tr.innerHTML = `
          <td>${medal}</td>
          <td>${escapeHtml(player.name)}</td>
          <td class="score-highlight">${player.score}</td>
          <td>${player.level || '-'}</td>
        `;

        tbody.appendChild(tr);
      });
    }


    function logoutUser() {
      fetch("php/login.php", { method: "POST", headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ action: 'logout' }) })
        .then(() => {
          isLoggedIn = false;
          currentUsername = null;
          checkLoginStatus();
        })
        .catch(err => console.error("Erro ao fazer logout:", err));
    }


    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c]));
    }

    // Verifica o status de login ao carregar a página
    checkLoginStatus();
    // Load shared auth script
    (function(){ var s=document.createElement('script'); s.src='js/auth.js'; document.body.appendChild(s); })();

    function toggleProfileDropdown(e, btn) {
      e.stopPropagation();
      const dropdown = btn && btn.parentElement ? btn.parentElement.querySelector('.profile-dropdown') : null;
      if (!dropdown) return;
      const expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      dropdown.style.display = expanded ? 'none' : 'flex';
    }
  </script>
</body>
</html>
